name: DKMS check

# Builds DKMS modules against kernel headers on a channel, the way a machine
# does on an update (bin/check-dkms). A kernel that renames or drops something
# an out-of-tree module uses turns this red before users reboot into it:
# linux-omarchy 7.2.8-9 renamed battery_hook_register and the TUXEDO modules
# stopped building on 4.0.5.
#
# It runs on its own:
#   - in every pull request build that ships a kernel or DKMS package, on
#     what it would publish (build-pr.yml's dkms jobs, which `result` needs);
#   - before every promotion, on what moves (promote.yml calls this);
#   - for a change to the check itself (pull_request below);
#   - daily, for the DKMS packages Omarchy installs from Arch (ci/dkms-packages
#     repo=), which Arch updates on its own schedule: against edge's kernels,
#     and only when one of those packages or a kernel has a version no green
#     run has seen yet (bin/check-dkms fingerprint).
# By hand, for a whole channel or what differs from another one:
#   gh workflow run dkms-check.yml -R omacom/omarchy-pkgs -f channel=stable
#   gh workflow run dkms-check.yml -R omacom/omarchy-pkgs -f channel=edge -f since=rc

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:
    inputs:
      channel:
        description: Channel whose kernels and DKMS packages to check
        type: choice
        options: [edge, rc, stable]
        default: edge
      since:
        description: "Only what differs from this channel (empty: everything)"
        required: false
        default: ""
      from_repos:
        description: Only the DKMS packages from Arch's repositories, against every kernel
        type: boolean
        default: false
  workflow_call:
    inputs:
      channel:
        type: string
        required: true
      since:
        type: string
        default: ""
      packages:
        description: Only these packages or pkgbases (space-separated); empty means all
        type: string
        default: ""
  pull_request:
    paths:
      - bin/check-dkms
      - ci/dkms-packages
      - .github/workflows/dkms-check.yml

permissions:
  contents: read

jobs:
  check:
    name: DKMS on ${{ inputs.channel || 'edge' }}${{ inputs.since && format(' since {0}', inputs.since) || '' }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    # GitHub-hosted, with no secrets: the check only reads published packages,
    # and it installs them as root in a throwaway container.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    concurrency:
      group: dkms-check-${{ github.event_name }}-${{ github.ref }}-${{ inputs.channel || 'edge' }}-${{ matrix.arch }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The daily run builds only what no green run has built yet: the cache
      # entry is the fingerprint of the versions it depends on.
      - name: Fingerprint Arch's DKMS packages and edge's kernels
        id: fingerprint
        if: github.event_name == 'schedule'
        run: |
          print=$(bin/check-dkms fingerprint --arch "${{ matrix.arch }}" --channel edge)
          printf '%s\n' "$print"
          mkdir -p .dkms-seen
          printf '%s\n' "$print" > .dkms-seen/fingerprint
          echo "key=dkms-repos-${{ matrix.arch }}-$(sha256sum .dkms-seen/fingerprint | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - name: Look for a green run with the same fingerprint
        id: seen
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .dkms-seen
          key: ${{ steps.fingerprint.outputs.key }}
          lookup-only: true
      - name: Build DKMS modules against ${{ inputs.channel || 'edge' }} kernels
        if: steps.seen.outputs.cache-hit != 'true'
        env:
          CHANNEL: ${{ inputs.channel || 'edge' }}
          SINCE: ${{ inputs.since }}
          PACKAGES: ${{ inputs.packages }}
          FROM_REPOS: ${{ github.event_name == 'schedule' || inputs.from_repos == true }}
        run: |
          args=(--arch "${{ matrix.arch }}" --channel "$CHANNEL")
          [[ -z $SINCE ]] || args+=(--since "$SINCE")
          [[ -z $PACKAGES ]] || args+=(--packages "$PACKAGES")
          [[ $FROM_REPOS != true ]] || args+=(--from-repos)
          bin/check-dkms container "${args[@]}"
      - name: Remember this fingerprint as built
        if: github.event_name == 'schedule' && steps.seen.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .dkms-seen
          key: ${{ steps.fingerprint.outputs.key }}
